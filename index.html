
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | StyleSphere</title>

    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <header class="auth-header">
        <a href="dashboard.html" class="logo">StyleSphere<span>.</span></a>
    </header>

    <main class="auth-container">

        <section class="auth-card">

            <p class="eyebrow">WELCOME BACK</p>

            <h1>Good to see you <span>again.</span></h1>

            <p class="auth-description">
                Sign in to discover your style and explore your favourite designers.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="auth-options">
                    <label class="remember-label">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="contact.html">Need help?</a>
                </div>

                <button type="submit" class="auth-button">
                    Log In →
                </button>

                <p id="loginMessage" class="form-message"></p>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

        </section>

    </main>

    <footer class="auth-footer">
        <p>© 2026 StyleSphere. Where fashion meets individuality.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
